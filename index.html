<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelmiküla Kassijaam</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f6edbf;
      --text: #3f3426;
      --muted: #7a6b56;
      --line: rgba(63, 52, 38, 0.28);
      --link: #5c422b;
      --card: #fffdf4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(255, 252, 226, 0.9), transparent 42%),
        var(--bg);
      color: var(--text);
      font-family: "Cormorant Garamond", Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 24px;
    }

    main {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .logo-card {
      width: 270px;
      height: 170px;
      margin: 0 auto 64px;
      padding: 28px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 18px 45px rgba(63, 52, 38, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    .divider {
      width: 220px;
      margin: 0 auto 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--muted);
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      width: 92px;
      background: var(--line);
    }

    .divider span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(63, 52, 38, 0.32);
      display: inline-block;
    }

    .notice {
      max-width: 760px;
      margin: 0 auto;
      font-size: 28px;
      line-height: 1.55;
      font-weight: 500;
      letter-spacing: 0.01em;
    }

    .notice p {
      margin: 0 0 34px;
    }

    .notice p:last-child {
      margin-bottom: 0;
    }

    a {
      color: var(--link);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
    }

    a:hover {
      color: #2f2117;
    }

    .bottom-divider {
      margin-top: 56px;
      margin-bottom: 42px;
    }

    footer {
      color: var(--muted);
      font-size: 19px;
      font-style: italic;
      letter-spacing: 0.08em;
    }

    @media (max-width: 700px) {
      body {
        padding: 48px 20px;
      }

      .logo-card {
        width: 230px;
        height: 145px;
        margin-bottom: 52px;
        border-radius: 18px;
      }

      .divider {
        margin-bottom: 42px;
      }

      .notice {
        font-size: 23px;
        line-height: 1.6;
      }

      footer {
        font-size: 17px;
      }
    }

    @media (max-width: 420px) {
      .notice {
        font-size: 21px;
      }

      .logo-card {
        width: 210px;
        height: 135px;
      }

      .divider {
        width: 180px;
      }

      .divider::before,
      .divider::after {
        width: 72px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="logo-card">
      <img src="logo.png" alt="Kelmiküla Kassijaam logo">
    </div>

    <div class="divider" aria-hidden="true">
      <span></span>
    </div>

    <section class="notice">
      <p>
        Jaanuaris 2025 lõpetas Kelmiküla Kassijaam oma aktiivse tegevuse ja
        kassituba sai kassidest tühjaks. Mõned kassid elavad hoiukodus, mis
        on aastatega saanud nagu päris koduks ja hoiuinimene saanud oma
        inimeseks.
      </p>

      <p>
        Ajakohast infot leiab
        <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer">
          Facebooki lehel
        </a>.
      </p>
    </section>

    <div class="divider bottom-divider" aria-hidden="true">
      <span></span>
    </div>

    <footer>
      Aitäh kõigile toetajatele
    </footer>
  </main>
</body>
</html>
